[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herd-merging"
version = "0.1.0"
description = "HeRD merging, local-Jacobian activation steering, and behavioral evaluation"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6",
  "transformers>=5.5,<6",
  "datasets>=2.20",
  "accelerate>=0.34",
  "peft>=0.17",
  "safetensors>=0.4",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "sentencepiece>=0.2",
  "orjson>=3.10",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["analysis", "steered_finetuner"]
